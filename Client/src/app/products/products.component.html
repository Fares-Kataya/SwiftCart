<div class="container mx-auto px-4 py-8">
  <div class="flex flex-col md:flex-row md:items-center md:justify-between mb-6 space-y-4 md:space-y-0">
    <h1 class="text-3xl font-bold">Our Products</h1>
    <div class="flex flex-col sm:flex-row sm:items-center sm:space-x-4 space-y-2 sm:space-y-0 w-full sm:w-auto">
      <input
        type="text"
        placeholder="Search…"
        [(ngModel)]="search"
        (ngModelChange)="onSearchChange($event)"
        class="px-3 py-2 border rounded-md w-full sm:w-64"
      />
      <select
        [(ngModel)]="sort"
        (ngModelChange)="onSortChange($event)"
        class="px-3 py-2 border rounded-md w-full sm:w-48"
      >
        <option [ngValue]="null">Sort By</option>
        <option value="priceAsc">Price ↑</option>
        <option value="priceDesc">Price ↓</option>
        <option value="newest">Newest</option>
      </select>
    </div>
  </div>

  <div class="flex flex-col lg:flex-row lg:space-x-6">
    <aside class="hidden lg:block w-64 bg-white p-4 rounded-lg shadow-sm">
      <div class="flex justify-between items-center mb-4">
        <h2 class="font-semibold text-lg">Filters</h2>
        <button class="text-sm" (click)="clearAllFilters()">Clear All</button>
      </div>

      <div class="mb-4">
        <h3 class="text-sm font-medium mb-2">Categories</h3>
        <div class="space-y-1">
          <label *ngFor="let c of categories" class="flex items-center">
            <input type="checkbox"
                   [(ngModel)]="filterState.selectedCategories[c]" class="ring-0"/>
            <span class="ml-2">{{c}}</span>
          </label>
        </div>
      </div>

      <div class="mb-4">
        <h3 class="text-sm font-medium mb-2">Price Range</h3>
        <ngx-slider
          [(value)]="filterState.minPrice"
          [(highValue)]="filterState.maxPrice"
          [options]="{ floor: 0, ceil: 1000, step: 10 }"
        ></ngx-slider>
        <div class="flex justify-between text-sm mt-2">
          <span>${{filterState.minPrice}}</span>
          <span>${{filterState.maxPrice}}</span>
        </div>
      </div>

      <div class="mb-4">
        <h3 class="text-sm font-medium mb-2">Customer Ratings</h3>
        <div class="space-y-1">
          <label *ngFor="let r of [5,4,3,2,1]" class="flex items-center space-x-2">
            <input type="checkbox" [(ngModel)]="filterState.selectedRatings[r]" />
            <div class="flex space-x-0.5">
              <ng-container *ngFor="let s of [].constructor(5); let i = index">
                <svg
                  class="w-4 h-4"
                  [ngClass]="{ 'text-yellow-400': i < r, 'text-gray-300': i >= r }"
                  aria-hidden="true"
                  xmlns="http://www.w3.org/2000/svg"
                  fill="currentColor"
                  viewBox="0 0 22 20"
                >
                  <path d="M20.924 7.625a1.523 1.523 0 0 0-1.238-1.044l-5.051-.734-2.259-4.577a1.534 1.534 0 0 0-2.752 0L7.365 5.847l-5.051.734A1.535 1.535 0 0 0 1.463 9.2l3.656 3.563-.863 5.031a1.532 1.532 0 0 0 2.226 1.616L11 17.033l4.518 2.375a1.534 1.534 0 0 0 2.226-1.617l-.863-5.03L20.537 9.2a1.523 1.523 0 0 0 .387-1.575Z"/>
                </svg>
              </ng-container>
            </div>
          </label>
        </div>
      </div>

      <div class="mb-4">
        <h3 class="text-sm font-medium mb-2">Availability</h3>
        <label class="flex items-center">
          <input type="checkbox"
                 [(ngModel)]="filterState.inStockOnly" />
          <span class="ml-2">In Stock</span>
        </label>
        <label class="flex items-center mt-1">
          <input type="checkbox"
                 [(ngModel)]="filterState.onSaleOnly" />
          <span class="ml-2">On Sale</span>
        </label>
      </div>

      <button
        class="w-full mt-4 px-4 py-2 bg-blue-600 text-white rounded-md"
        (click)="onApplyFilters()"
      >Apply Filters</button>
    </aside>

    <div class="flex-1">
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-3 gap-6">
        <ng-container *ngFor="let p of products">
          <div class="w-full bg-white border border-gray-200 rounded-lg shadow-sm dark:bg-white dark:border-gray-200">
            <span
              *ngIf="p.isNew"
              class="bg-blue-100 text-white text-xs font-medium me-2 px-2.5 py-0.5 rounded-full dark:bg-blue-800 dark:text-black relative left-5 top-4"
            >New Arrival</span>
            <span
              *ngIf="p.stock === 0"
              class="relative top-4 left-5 bg-red-600 text-white text-xs font-medium px-2.5 py-0.5 rounded-full z-10"
            >Out of Stock</span>
            <a href="#">
              <div class="flex justify-center items-center">
              <img class="p-5 h-80 rounded-2xl" [src]="p.imageUrl" [alt]="p.title" /> </div>
            </a>
            <div class="px-5 pb-5">
              <a href="#">
                <h5 class="text-xl font-semibold tracking-tight dark:text-gray-900">
                  {{p.title}}
                </h5>
              </a>
              <p class="text-sm text-gray-500 mb-4 line-clamp-3">{{p.description}}</p>
              <div class="flex items-center mt-2.5 mb-5">
                <div class="flex items-center space-x-1 rtl:space-x-reverse">
                  <ng-container *ngFor="let star of [1,2,3,4,5]">
                    <svg *ngIf="star <= Math.floor(p.rating || 0)"
                          class="w-4 h-4 text-yellow-300"
                          aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 22 20">
                      <path d="M20.924 7.625a1.523 1.523 0 0 0-1.238-1.044l-5.051-.734-2.259-4.577a1.534 1.534 0 0 0-2.752 0L7.365 5.847l-5.051.734A1.535 1.535 0 0 0 1.463 9.2l3.656 3.563-.863 5.031a1.532 1.532 0 0 0 2.226 1.616L11 17.033l4.518 2.375a1.534 1.534 0 0 0 2.226-1.617l-.863-5.03L20.537 9.2a1.523 1.523 0 0 0 .387-1.575Z"/>
                    </svg>
                    <svg *ngIf="star > Math.floor(p.rating || 0)"
                          class="w-4 h-4 text-gray-200 dark:text-gray-600"
                          aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 22 20">
                      <path d="M20.924 7.625a1.523 1.523 0 0 0-1.238-1.044l-5.051-.734-2.259-4.577a1.534 1.534 0 0 0-2.752 0L7.365 5.847l-5.051.734A1.535 1.535 0 0 0 1.463 9.2l3.656 3.563-.863 5.031a1.532 1.532 0 0 0 2.226 1.616L11 17.033l4.518 2.375a1.534 1.534 0 0 0 2.226-1.617l-.863-5.03L20.537 9.2a1.523 1.523 0 0 0 .387-1.575Z"/>
                    </svg>
                  </ng-container>
                </div>
                <span class="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-0.5 rounded-sm dark:bg-blue-200 dark:text-blue-800 ms-3">{{ p.rating ? p.rating.toFixed(1) : 'N/A' }}</span>
              </div>
              <div class="flex items-center justify-between">
                <span class="text-3xl font-bold text-gray-900 dark:text-gray-900">${{p.price.toFixed(2)}}</span>
                <button class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800 flex justify-center items-center gap-2" (click)="cartService.addToCart(p)">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-shopping-cart-icon lucide-shopping-cart">
                    <circle cx="8" cy="21" r="1"/>
                    <circle cx="19" cy="21" r="1"/>
                    <path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/>
                  </svg>
                  Add to cart
                </button>
              </div>
            </div>
          </div>
        </ng-container>
        <div *ngIf="products.length===0" class="col-span-full text-center text-gray-500">
          No products found.
        </div>
      </div>

      <div class="mt-8 flex justify-center space-x-2">
        <button
          *ngFor="let _ of [].constructor(totalPages); let i=index"
          (click)="goToPage(i+1)"
          [ngClass]="{
            'bg-blue-600 text-white': page===i+1,
            'bg-white text-gray-700 hover:bg-gray-50': page!==i+1
          }"
          class="px-3 py-1 border rounded-md"
        >{{i+1}}</button>
      </div>
    </div>
  </div>
</div>

<h2 class="flex justify-center text-3xl font-bold">Featured Products</h2>

<div id="indicators-carousel" class="relative w-full mt-5 h-[550px]" data-carousel="static">
  <div class="relative h-[600px] overflow-hidden rounded-lg mx-15">
    <ng-container *ngIf="chunkedProducts.length > 0; else noProducts">
      <div *ngFor="let productChunk of chunkedProducts; let j = index"
           [ngClass]="{'hidden': j !== 0, 'duration-700 ease-in-out': true}"
           data-carousel-item>

        <!-- Grid for product cards -->
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5 px-5">
          <div *ngFor="let product of productChunk"
               class="flex flex-col justify-between w-full bg-white border border-gray-200 rounded-lg shadow-sm dark:bg-white dark:border-gray-200">

            <!-- Badges -->
            <div class="h-6 relative z-10">
              <span *ngIf="product.isNewArrival"
                    class="bg-blue-100 text-white text-xs font-medium px-2.5 py-0.5 rounded-full dark:bg-blue-800 dark:text-black absolute left-5 top-4">New Arrival</span>
              <span *ngIf="product.isBestSeller"
                    class="text-white text-xs font-medium px-2.5 py-0.5 rounded-full dark:bg-amber-600 dark:text-black absolute left-5 top-4">Best Seller</span>
              <span *ngIf="product.isOnSale"
                    class="text-white text-xs font-medium px-2.5 py-0.5 rounded-full dark:bg-purple-800 dark:text-black absolute left-5 top-4">Sale</span>
            </div>

            <!-- Product Image -->
            <a href="#">
              <img class="p-5 w-full h-[200px] object-contain"
                   [src]="product.imageUrl || '/assets/placeholder.jpg'"
                   [alt]="product.name + ' image'" />
            </a>

            <!-- Product Info -->
            <div class="px-5 pb-3">
              <a href="#">
                <h5 class="text-lg font-semibold tracking-tight dark:text-gray-900 h-12 overflow-hidden">
                  {{ product.name }}
                </h5>
              </a>

              <!-- Rating -->
              <div class="flex items-center mt-2 mb-3">
                <div class="flex items-center space-x-1 rtl:space-x-reverse">
                  <ng-container *ngFor="let star of [1, 2, 3, 4, 5]">
                    <svg class="w-4 h-4"
                         [ngClass]="{'text-yellow-300': product.rating >= star, 'text-gray-200 dark:text-gray-600': product.rating < star}"
                         xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 22 20" aria-hidden="true">
                      <path d="M20.924 7.625a1.523 1.523 0 0 0-1.238-1.044l-5.051-.734-2.259-4.577a1.534 1.534 0 0 0-2.752 0L7.365 5.847l-5.051.734A1.535 1.535 0 0 0 1.463 9.2l3.656 3.563-.863 5.031a1.532 1.532 0 0 0 2.226 1.616L11 17.033l4.518 2.375a1.534 1.534 0 0 0 2.226-1.617l-.863-5.03L20.537 9.2a1.523 1.523 0 0 0 .387-1.575Z" />
                    </svg>
                  </ng-container>
                </div>
                <span class="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-0.5 rounded-sm dark:bg-blue-200 dark:text-blue-800 ms-3">
                  {{ product.rating | number:'1.1-1' }}
                </span>
              </div>
            </div>

            <!-- Price and Add to Cart -->
            <div class="px-5 pb-5 flex items-center justify-between mt-auto">
              <span class="text-2xl font-bold text-gray-900 dark:text-gray-900">
                ${{ product.price | number:'1.2-2' }}
              </span>
              <a href="#"
                 class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800 flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                     fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round"
                     class="lucide lucide-shopping-cart-icon">
                  <circle cx="8" cy="21" r="1" />
                  <circle cx="19" cy="21" r="1" />
                  <path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12" />
                </svg>
                Add to cart
              </a>
            </div>
          </div>
        </div>
      </div>
    </ng-container>

    <ng-template #noProducts>
      <div *ngIf="errorMessage" class="text-red-600 text-center text-lg mt-10">{{ errorMessage }}</div>
      <div *ngIf="!errorMessage && products.length === 0" class="text-gray-500 text-center text-lg mt-10">No featured products found.</div>
    </ng-template>
  </div>

  <!-- Carousel Indicators -->
  <div class="absolute z-30 flex -translate-x-1/2 bottom-5 left-1/2 space-x-3 rtl:space-x-reverse" data-carousel-indicators>
    <button *ngFor="let productChunk of chunkedProducts; let j = index"
            type="button"
            class="w-3 h-3 rounded-full"
            [attr.aria-current]="j === 0 ? 'true' : 'false'"
            [attr.aria-label]="'Slide ' + (j + 1)"
            [attr.data-carousel-slide-to]="j">
    </button>
  </div>

  <!-- Carousel Controls -->
  <button type="button" class="absolute top-0 start-0 z-30 flex items-center justify-center h-full px-4 cursor-pointer group focus:outline-none" data-carousel-prev>
    <span class="inline-flex items-center justify-center w-10 h-10 rounded-full bg-white/30 dark:bg-gray-800/30 group-hover:bg-white/50 dark:group-hover:bg-gray-800/60 group-focus:ring-4 group-focus:ring-white dark:group-focus:ring-gray-800/70 group-focus:outline-none">
      <svg class="w-4 h-4 text-white dark:text-gray-800 rtl:rotate-180"
           xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 6 10">
        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 1 1 5l4 4" />
      </svg>
      <span class="sr-only">Previous</span>
    </span>
  </button>
  <button type="button" class="absolute top-0 end-0 z-30 flex items-center justify-center h-full px-4 cursor-pointer group focus:outline-none" data-carousel-next>
    <span class="inline-flex items-center justify-center w-10 h-10 rounded-full bg-white/30 dark:bg-gray-800/30 group-hover:bg-white/50 dark:group-hover:bg-gray-800/60 group-focus:ring-4 group-focus:ring-white dark:group-focus:ring-gray-800/70 group-focus:outline-none">
      <svg class="w-4 h-4 text-white dark:text-gray-800 rtl:rotate-180"
           xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 6 10">
        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M1 9l4-4-4-4" />
      </svg>
      <span class="sr-only">Next</span>
    </span>
  </button>
</div>

<a href="#" class="font-medium text-blue-600 dark:text-blue-500 hover:underline flex gap-2 justify-center mb-10 items-center">View All Products →</a>
